# Deploy to Cloudflare
#
# Every push to `main` — whoever makes it — builds the site and ships the Worker,
# so a backend change is visible at
# https://flexfit-studio.amitynoidalibrary.workers.dev without anyone running
# wrangler by hand.
#
# Two repository secrets are required (Settings → Secrets and variables →
# Actions):
#   CLOUDFLARE_API_TOKEN   a token with the "Edit Cloudflare Workers" template,
#                          plus D1 edit if you ever add a migration step here
#   CLOUDFLARE_ACCOUNT_ID  the account the Worker lives in
#
# Without them the job fails at the deploy step with an auth error rather than
# doing something surprising.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      migrations_applied:
        description: 'Schema change already applied to the remote D1 (pnpm db:remote)?'
        type: boolean
        default: false

# Never let two deploys overlap, and never cancel one halfway — a cancelled
# `wrangler deploy` can leave the rollout mid-flight.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          # The migration guard below diffs this push against its predecessor.
          fetch-depth: 0

      # A schema change deployed BEFORE it is applied to the remote database
      # means every request 500s on a missing column for the whole rollout, and
      # the failure looks like a bad deploy rather than a missing migration.
      # The order is: apply the migration, then ship the code that needs it.
      # This step stops the deploy so that order cannot be got wrong by accident.
      - name: Guard — has the schema change been applied to D1?
        if: github.event_name == 'push'
        run: |
          before='${{ github.event.before }}'
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "No previous commit to diff against; skipping the guard."
            exit 0
          fi
          changed=$(git diff --name-only "$before" '${{ github.sha }}' -- server/db/migrations/ || true)
          if [ -n "$changed" ]; then
            echo "::error title=Migration not applied::This push changes the D1 schema:"
            echo "$changed"
            echo ""
            echo "Apply it to the remote database FIRST:"
            echo "    pnpm db:remote"
            echo ""
            echo "Then re-run this workflow from the Actions tab with"
            echo "'Schema change already applied' ticked."
            exit 1
          fi
          echo "No migration files in this push."

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # esbuild and workerd fetch a platform binary in postinstall; the
      # allowBuilds entries in pnpm-workspace.yaml are what let them.
      - name: Install
        run: pnpm install --frozen-lockfile

      # output: 'export' — writes the static site to out/, which wrangler.jsonc
      # serves as the asset directory.
      - name: Build
        run: pnpm exec next build

      # Without these, wrangler fails in about two seconds with an auth error
      # that does not say which secret is missing or where to put it. Checking
      # first turns "the run failed" into an instruction.
      - name: Check the Cloudflare credentials are configured
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -z "$TOKEN" ]   && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$ACCOUNT" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error title=Deploy not configured::Missing repository secret(s):$missing"
            {
              echo "### Not deployed — credentials missing"
              echo ""
              echo "The build succeeded. The deploy could not run because these"
              echo "repository secrets are not set:"
              echo ""
              for s in $missing; do echo "- \`$s\`"; done
              echo ""
              echo "Add them under **Settings → Secrets and variables → Actions**:"
              echo ""
              echo "| Secret | Where it comes from |"
              echo "| --- | --- |"
              echo "| \`CLOUDFLARE_API_TOKEN\` | Cloudflare dashboard → My Profile → API Tokens → Create Token → **Edit Cloudflare Workers** template |"
              echo "| \`CLOUDFLARE_ACCOUNT_ID\` | Cloudflare dashboard → Workers & Pages → Account ID in the right-hand pane |"
              echo ""
              echo "Then re-run this workflow. Nothing else needs changing."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Both secrets are present."

      # "Present" is not "accepted". A token that is expired, mis-pasted (the
      # dashboard wraps the value across two lines, which is easy to copy
      # badly) or scoped to another account fails inside wrangler in about two
      # seconds with an error that does not distinguish those cases. Asking
      # Cloudflare directly does, and none of it reveals the token.
      - name: Are the credentials actually accepted?
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          code=$(curl -sS -o /tmp/verify.json -w '%{http_code}' \
            https://api.cloudflare.com/client/v4/user/tokens/verify \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          if [ "$code" != "200" ]; then
            why=$(jq -r '[.errors[]? | "\(.code): \(.message)"] | join("; ")' /tmp/verify.json)
            echo "::error title=Cloudflare rejected the token::HTTP $code — ${why:-no detail}. Re-copy CLOUDFLARE_API_TOKEN with the dashboard's copy button (the displayed value wraps onto two lines) and check it has not expired."
            exit 1
          fi
          echo "Token accepted: $(jq -r '.result.status' /tmp/verify.json)"

          # Warning, not a gate: a token can be allowed to deploy a Worker while
          # not being allowed to read account settings, so a failure here does
          # not by itself mean the deploy will fail.
          acct=$(curl -sS -o /tmp/acct.json -w '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          if [ "$acct" != "200" ]; then
            why=$(jq -r '[.errors[]? | "\(.code): \(.message)"] | join("; ")' /tmp/acct.json)
            echo "::warning title=Account not readable with this token::HTTP $acct — ${why:-no detail}. If the deploy fails next, CLOUDFLARE_ACCOUNT_ID is the thing to check."
          else
            echo "Account visible: $(jq -r '.result.name' /tmp/acct.json)"
          fi

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          if ! pnpm exec wrangler deploy 2>&1 | tee /tmp/deploy.log; then
            # Surface wrangler's own words as annotations, so the reason is on
            # the run page instead of buried in a log only admins can download.
            tail -n 25 /tmp/deploy.log | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::${line}"
            done
            exit 1
          fi

      # Immediately after a deploy two versions briefly serve at once, so a
      # request can still hit the old one. Testing inside that window reports
      # failures that are really just the rollout.
      - name: Wait for the rollout
        run: sleep 30

      # Proof the change is actually live, rather than "the upload succeeded":
      # the site serves, the API answers with every collection, and the
      # materialised heatmap still agrees with the check-in table.
      #
      # Deliberately NOT scripts/test-api.mjs — that suite issues real refunds
      # and records real check-ins. It would write test rows into live data, and
      # because a payment can only be refunded once it would fail on the second
      # deploy and every deploy after it, reporting a broken pipeline when
      # nothing is wrong. smoke.mjs only reads, so it is safe on every deploy.
      - name: Verify the deployment
        env:
          BASE: https://flexfit-studio.amitynoidalibrary.workers.dev
        run: node scripts/smoke.mjs

      - name: Summary
        if: success()
        run: |
          {
            echo "### Deployed"
            echo ""
            echo "https://flexfit-studio.amitynoidalibrary.workers.dev"
            echo ""
            echo "Smoke checks passed against the live Worker."
          } >> "$GITHUB_STEP_SUMMARY"
